name: Asset-free native release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Unique release version (ASCII letters, digits, dot, underscore, hyphen)'
        required: true
        type: string
      sequence:
        description: 'Strictly increasing per-channel sequence (decimal integer, 1–18446744073709551615)'
        required: true
        type: string
      channel:
        description: 'Signed update channel'
        required: true
        type: choice
        options: [stable, experimental]
      sign:
        description: 'Authorize production signing with the protected environment key'
        required: true
        default: false
        type: boolean
      publish:
        description: 'Authorize GitHub Release publication (requires sign and production approval)'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: native-release-${{ github.ref }}-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    # Configure required reviewers and trusted branch restrictions for this
    # environment. Signing requires BOTH approval and the explicit sign input.
    environment: native-release-signing
    container:
      # Debian 13 amd64 image built 2026-10-05; immutable image manifest.
      image: debian@sha256:918311b7b6c4c6f68b232ba516584925f6c78ad82b6fd534b98979df6438e483
    defaults:
      run:
        shell: bash
    env:
      DEBIAN_FRONTEND: noninteractive
      RELEASE_VERSION: ${{ inputs.version }}
      RELEASE_CHANNEL: ${{ inputs.channel }}
      RELEASE_SEQUENCE: ${{ inputs.sequence }}
      PUBLISH_RELEASE: ${{ inputs.publish }}
      SIGN_RELEASE: ${{ inputs.sign }}
      RELEASE_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - name: Install exactly pinned public build dependencies
        run: |
          set -euo pipefail
          rm -f /etc/apt/sources.list /etc/apt/sources.list.d/debian.sources
          # Bootstrap before CA certificates exist in the slim image. APT still
          # requires Debian-signed indexes and verifies every package digest.
          cat > /etc/apt/sources.list <<'SOURCES'
          deb [check-valid-until=no signed-by=/usr/share/keyrings/debian-archive-keyring.gpg] http://snapshot.debian.org/archive/debian/20261006T000000Z/ trixie main
          SOURCES
          apt-get update
          apt-get install --yes --no-install-recommends \
            build-essential=12.12 cmake=3.31.6-2 ninja-build=1.12.1-1 \
            pkg-config=1.8.1-4 git=1:2.47.3-0+deb13u1 \
            ca-certificates=20250419 python3=3.13.5-1 \
            openssl=3.5.7-1~deb13u2 libssl-dev=3.5.7-1~deb13u2 \
            libboost-dev=1.83.0.2+b2 nlohmann-json3-dev=3.11.3-2.1 \
            libpq-dev=17.11-0+deb13u1 zlib1g-dev=1:1.3.dfsg+really1.3.1-1+b1 \
            libsdl3-dev=3.2.10+ds-1 \
            qt6-base-dev=6.8.2+dfsg-9+deb13u2 \
            qt6-base-dev-tools=6.8.2+dfsg-9+deb13u2 \
            qt6-qpa-plugins=6.8.2+dfsg-9+deb13u2 \
            libfreetype-dev=2.13.3+dfsg-1+deb13u1 libfontconfig-dev=2.15.0-2.3 \
            libarchive-dev=3.7.4-4+deb13u1 libgl-dev=1.7.0-1+b2 \
            libvulkan-dev=1.4.309.0-1 glslc=2025.2-1 \
            innoextract=1.9-0.1+b1

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Validate explicit release inputs
        run: |
          set -euo pipefail
          if [[ "$PUBLISH_RELEASE" == true && "$SIGN_RELEASE" != true ]]; then
            echo 'Publication requires sign=true' >&2
            exit 1
          fi
          if [[ "$PUBLISH_RELEASE" == true ]]; then
            test -n "$RELEASE_DEFAULT_BRANCH"
            [[ "$GITHUB_REF" == "refs/heads/$RELEASE_DEFAULT_BRANCH" ]] || {
              echo 'Publication must be dispatched from the reviewed repository default branch' >&2
              exit 1
            }
          fi
          [[ "$RELEASE_VERSION" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,95}$ ]]
          [[ "$RELEASE_VERSION" != . && "$RELEASE_VERSION" != .. ]]
          [[ "$RELEASE_CHANNEL" == stable || "$RELEASE_CHANNEL" == experimental ]]
          python3 - <<'PY'
          import os
          import re
          sequence = os.environ['RELEASE_SEQUENCE']
          if not re.fullmatch(r'[1-9][0-9]{0,19}', sequence) or int(sequence) > 18446744073709551615:
              raise SystemExit('Release sequence must be a positive decimal uint64 (1–18446744073709551615)')
          PY

      - name: Build pinned public SDL 3.4.18 static dependency
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import os
          from pathlib import Path
          import urllib.request
          url = 'https://github.com/libsdl-org/SDL/releases/download/release-3.4.18/SDL3-3.4.18.tar.gz'
          data = urllib.request.urlopen(url, timeout=120).read()
          expected = '9c75cf16330322c217dedd2e0609f1124f1b54b8633e763467b4684d0f4334a3'
          if hashlib.sha256(data).hexdigest() != expected:
              raise SystemExit('Public SDL archive SHA-256 mismatch')
          (Path(os.environ['RUNNER_TEMP']) / 'SDL3-3.4.18.tar.gz').write_bytes(data)
          PY
          tar -xzf "$RUNNER_TEMP/SDL3-3.4.18.tar.gz" -C "$RUNNER_TEMP"
          cmake -S "$RUNNER_TEMP/SDL3-3.4.18" -B build-sdl -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            -DCMAKE_INSTALL_PREFIX=/opt/ikv-public-deps \
            -DSDL_SHARED=OFF -DSDL_STATIC=ON -DSDL_TESTS=OFF -DSDL_EXAMPLES=OFF
          cmake --build build-sdl --parallel 2
          cmake --install build-sdl

      - name: Build the real native targets without original assets
        run: |
          set -euo pipefail
          cmake -S . -B build-release -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF \
            -DCMAKE_PREFIX_PATH=/opt/ikv-public-deps \
            -DIKV_BUILD_CLIENT=ON -DIKV_BUILD_LAUNCHER=ON \
            -DIKV_BUILD_ASSET_TOOLS=ON -DIKV_BUILD_ORIGINAL_TOOLS=ON
          cmake --build build-release --parallel 2
          cmake --install build-release --prefix "$PWD/package"
          mkdir -p package/share/ikv/licenses
          install -m 644 "$RUNNER_TEMP/SDL3-3.4.18/LICENSE.txt" package/share/ikv/licenses/SDL3-LICENSE.txt

      - name: Package only installed native code and owned resources
        run: |
          set -euo pipefail
          for binary in client launcher updater assets original-inspect auth server; do
            test -x "package/bin/ikv-$binary"
          done
          python3 - <<'PY'
          from pathlib import Path
          import stat
          root = Path('package')
          if {p.name for p in root.iterdir()} != {'bin', 'share'}:
              raise SystemExit('Unexpected installation root: packaging denied')
          for p in root.rglob('*'):
              mode = p.lstat().st_mode
              if not (stat.S_ISDIR(mode) or stat.S_ISREG(mode)):
                  raise SystemExit(f'Non-regular installed payload: {p}')
              rel = p.relative_to(root)
              if rel.parts[0] == 'share' and rel != Path('share') and rel.parts[1] != 'ikv':
                  raise SystemExit(f'Unexpected installed resources: {p}')
          PY
          mkdir -p dist
          SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
          tar --sort=name --mtime="@$SOURCE_DATE_EPOCH" --owner=0 --group=0 \
            --numeric-owner -C package -cf - bin share | gzip -n \
            > "dist/ikv-linux-x86_64-$RELEASE_VERSION.tar.gz"
          dpkg-query -W -f='${binary:Package}\t${Version}\n' > dist/build-packages.tsv
          printf '%s\n' "$GITHUB_SHA" > dist/source-commit.txt

      - name: Sign exact manifest bytes with externally configured production key
        if: ${{ inputs.sign }}
        env:
          PRODUCTION_SIGNING_KEY: ${{ secrets.IKV_RELEASE_SIGNING_KEY_PEM }}
        run: |
          set -euo pipefail
          test -n "$PRODUCTION_SIGNING_KEY" || { echo 'Production signing secret is not configured' >&2; exit 1; }
          umask 077
          key=$(mktemp "$RUNNER_TEMP/ikv-release-key-XXXXXX.pem")
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$PRODUCTION_SIGNING_KEY" > "$key"
          unset PRODUCTION_SIGNING_KEY
          python3 tools/sign_manifest.py \
            --root package \
            --package "dist/ikv-linux-x86_64-$RELEASE_VERSION.tar.gz" \
            --version "$RELEASE_VERSION" --channel "$RELEASE_CHANNEL" \
            --sequence "$RELEASE_SEQUENCE" \
            --output dist/manifest.json --signature dist/manifest.sig \
            --key-file "$key"

      - name: Upload packaged workflow artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ikv-native-${{ inputs.channel }}-${{ inputs.version }}-${{ github.run_id }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  publish:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read # Required to inspect environment protection rules.
    environment: native-release-production
    concurrency:
      group: native-release-publication-${{ github.repository }}-${{ inputs.channel }}
      cancel-in-progress: false
    container:
      image: debian@sha256:918311b7b6c4c6f68b232ba516584925f6c78ad82b6fd534b98979df6438e483
    defaults:
      run:
        shell: bash
    env:
      DEBIAN_FRONTEND: noninteractive
      RELEASE_VERSION: ${{ inputs.version }}
      SIGN_RELEASE: ${{ inputs.sign }}
    steps:
      - name: Install exactly pinned public publication dependencies
        run: |
          set -euo pipefail
          rm -f /etc/apt/sources.list /etc/apt/sources.list.d/debian.sources
          cat > /etc/apt/sources.list <<'SOURCES'
          deb [check-valid-until=no signed-by=/usr/share/keyrings/debian-archive-keyring.gpg] http://snapshot.debian.org/archive/debian/20261006T000000Z/ trixie main
          SOURCES
          apt-get update
          apt-get install --yes --no-install-recommends \
            ca-certificates=20250419 python3=3.13.5-1 \
            openssl=3.5.7-1~deb13u2 git=1:2.47.3-0+deb13u1 gh=2.46.0-3

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Download this run's actual signed package
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ikv-native-${{ inputs.channel }}-${{ inputs.version }}-${{ github.run_id }}
          path: dist/

      - name: Reserve sequence and publish trusted immutable release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_PUBLIC_KEY: ${{ secrets.IKV_RELEASE_PUBLIC_KEY_PEM || vars.IKV_RELEASE_PUBLIC_KEY_PEM }}
          RELEASE_LEDGER_BRANCH: ${{ vars.IKV_RELEASE_LEDGER_BRANCH }}
        run: |
          set -euo pipefail
          [[ "$SIGN_RELEASE" == true ]] || { echo 'Publication requires sign=true' >&2; exit 1; }
          test -n "$RELEASE_PUBLIC_KEY" || { echo 'Production public trust root is not configured' >&2; exit 1; }
          test -n "$RELEASE_LEDGER_BRANCH" || { echo 'Existing operator-initialized ledger branch is not configured' >&2; exit 1; }
          [[ "$(cat dist/source-commit.txt)" == "$GITHUB_SHA" ]] || { echo 'Artifact source commit mismatch' >&2; exit 1; }
          umask 077
          trust=$(mktemp "$RUNNER_TEMP/ikv-release-trust-XXXXXX.pem")
          trap 'rm -f "$trust"' EXIT
          printf '%s\n' "$RELEASE_PUBLIC_KEY" > "$trust"
          chmod 0600 "$trust"
          unset RELEASE_PUBLIC_KEY
          # The publisher fails closed unless the environment has required
          # reviewers and the preexisting channel ledger is valid. It verifies
          # the Ed25519 signature/package before any Contents CAS or release write.
          python3 tools/publish_release.py \
            --repo "$GITHUB_REPOSITORY" \
            --manifest dist/manifest.json --signature dist/manifest.sig \
            --package "dist/ikv-linux-x86_64-$RELEASE_VERSION.tar.gz" \
            --trust "$trust" --ledger-ref "$RELEASE_LEDGER_BRANCH" \
            --target "$GITHUB_SHA" --publish
