services:
  database:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/db-password
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    secrets:
      - db-password
      - app-db-password
    volumes:
      - database:/var/lib/postgresql/data
      - ./deploy/init-database.sh:/docker-entrypoint-initdb.d/10-ikv.sh:ro
    networks:
      - backend
    restart: on-failure
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "ikv", "-d", "ikv"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 1g
    pids_limit: 128
    logging: &logging
      driver: local
      options: {max-size: "10m", max-file: "3"}

  auth:
    image: ikv-native-backend:local
    build: {context: ., target: runtime}
    command: ["auth"]
    depends_on:
      database: {condition: service_healthy}
    # Management 7444 binds container loopback and is NEVER published.
    ports:
      - "${IKV_BIND:-127.0.0.1}:7443:7443/tcp"
    secrets: &service_secrets
      - source: dsn
        target: dsn
      - source: tls-cert
        target: tls-cert
      - source: tls-key
        target: tls-key
      - source: tls-ca
        target: tls-ca
    volumes:
      - backups:/var/lib/ikv/backups
    tmpfs: &tmpfs
      - /run/ikv:rw,noexec,nosuid,nodev,mode=0700,uid=10001,gid=10001,size=1m
      - /tmp:rw,noexec,nosuid,nodev,mode=0700,uid=10001,gid=10001,size=16m
    networks: [backend, frontend]
    restart: on-failure
    stop_grace_period: 20s
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    cpus: 1.0
    mem_limit: 512m
    pids_limit: 64
    healthcheck:
      test: ["CMD", "/bin/sh", "/usr/local/libexec/ikv/container-health.sh", "auth"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 5
    logging: *logging

  world:
    image: ikv-native-backend:local
    build: {context: ., target: runtime}
    command: ["world"]
    depends_on:
      database: {condition: service_healthy}
      auth: {condition: service_healthy}
    ports:
      - "${IKV_BIND:-127.0.0.1}:7000:7000/tcp"
    secrets: *service_secrets
    environment:
      IKV_ASSET_ROOT: /srv/ikv/original
    volumes:
      - type: bind
        source: "${IKV_ASSET_ROOT:?set IKV_ASSET_ROOT to the readable local original asset directory}"
        target: /srv/ikv/original
        read_only: true
        bind:
          create_host_path: false
    tmpfs: *tmpfs
    networks: [backend, frontend]
    restart: on-failure
    stop_grace_period: 20s
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    cpus: 2.0
    mem_limit: 1g
    pids_limit: 64
    healthcheck:
      test: ["CMD", "/bin/sh", "/usr/local/libexec/ikv/container-health.sh", "world"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5
    logging: *logging

networks:
  backend:
    internal: true
  frontend: {}
volumes:
  database: {}
  backups: {}
secrets:
  db-password: {file: "${IKV_SECRETS_DIR:-./deploy/secrets}/db-password"}
  app-db-password: {file: "${IKV_SECRETS_DIR:-./deploy/secrets}/app-db-password"}
  dsn: {file: "${IKV_SECRETS_DIR:-./deploy/secrets}/dsn"}
  tls-cert: {file: "${IKV_SECRETS_DIR:-./deploy/secrets}/tls-cert"}
  tls-key: {file: "${IKV_SECRETS_DIR:-./deploy/secrets}/tls-key"}
  tls-ca: {file: "${IKV_SECRETS_DIR:-./deploy/secrets}/tls-ca"}
