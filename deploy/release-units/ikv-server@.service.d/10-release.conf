# Automatic updates (docs/SELF_HOSTING.md): run every shard (ikv-server@REALM-SHARD) from the active extracted signed
# release. Its exit 75 after the announced management restart is a failure exit, so Restart=on-failure starts it again
# from the new release.
[Service]
ExecStart=
ExecStart=/var/lib/ikv-release/active/AppRun ikv-server --bind ${IKV_BIND} --port ${IKV_WORLD_PORT} --realm ${IKV_REALM} --capacity ${IKV_CAPACITY} --cert %d/tls-cert --key %d/tls-key --dsn-file /run/ikv-world-%i/dsn --gameplay /var/lib/ikv-release/active/usr/share/ikv/config/gameplay.json --asset-root ${IKV_ASSET_ROOT} $IKV_SERVER_ARGS
