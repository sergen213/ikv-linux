# Automatic updates (docs/SELF_HOSTING.md): run ikv-server from the active extracted signed release. Its exit 75 after
# an announced management restart is a failure exit, so Restart=on-failure starts it again from the new release.
[Service]
ExecStart=
ExecStart=/var/lib/ikv-release/active/AppRun ikv-server --bind 127.0.0.1 --port 7000 --cert %d/tls-cert --key %d/tls-key --dsn-file /run/ikv-world/dsn --gameplay /var/lib/ikv-release/active/usr/share/ikv/config/gameplay.json --asset-root ${IKV_ASSET_ROOT}
