# Automatic updates (docs/SELF_HOSTING.md): run ikv-auth from the active extracted signed release.
[Service]
ExecStart=
ExecStart=/var/lib/ikv-release/active/AppRun ikv-auth --bind 127.0.0.1 --port 7443 --admin-bind 127.0.0.1 --admin-port 7444 --cert %d/tls-cert --key %d/tls-key --dsn-file /run/ikv-auth/dsn --migrations /var/lib/ikv-release/active/usr/share/ikv/database/migrations --web-root /var/lib/ikv-release/active/usr/share/ikv/web --backup-dir /var/lib/ikv/backups
